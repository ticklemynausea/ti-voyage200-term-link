<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 250" width="860" height="250" role="img"
     aria-labelledby="title desc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">How the pieces connect</title>
  <desc id="desc">The Voyage 200 runs calc/term and connects over its link port to an ESP32 running
    esp32_tilink_term. The ESP32 reaches a shell on the computer over USB serial, or a shell on
    another host over Wi-Fi and SSH.</desc>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="860" height="250" rx="10" fill="#f6f8fa"/>

  <g fill="#ffffff" stroke="#1f2328" stroke-width="2">
    <rect x="30" y="85" width="180" height="80" rx="8"/>
    <rect x="330" y="85" width="200" height="80" rx="8"/>
    <rect x="640" y="30" width="190" height="70" rx="8"/>
    <rect x="640" y="150" width="190" height="70" rx="8"/>
  </g>

  <g fill="none" stroke="#57606a" stroke-width="2" marker-start="url(#head)" marker-end="url(#head)">
    <path d="M214,125 H326"/>
    <path d="M534,110 C585,110 585,65 636,65"/>
    <path d="M534,140 C585,140 585,185 636,185"/>
  </g>

  <g text-anchor="middle" fill="#1f2328">
    <g font-size="18" font-weight="600">
      <text x="120" y="120">Voyage 200</text>
      <text x="430" y="120">ESP32</text>
    </g>
    <g font-size="16" font-weight="600">
      <text x="735" y="61">A shell on</text>
      <text x="735" y="82">the computer</text>
      <text x="735" y="181">A shell on</text>
      <text x="735" y="202">another host</text>
    </g>
    <g font-size="14" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="120" y="144">calc/term</text>
      <text x="430" y="144">esp32_tilink_term</text>
    </g>
    <g font-size="14" fill="#57606a">
      <text x="270" y="113">link port</text>
      <text x="577" y="62">USB serial</text>
      <text x="577" y="204">Wi-Fi, SSH</text>
    </g>
  </g>
</svg>
