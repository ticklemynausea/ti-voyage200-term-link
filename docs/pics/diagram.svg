<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 250" width="1060" height="250" role="img"
     aria-labelledby="title desc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">How the pieces connect</title>
  <desc id="desc">The Voyage 200 runs calc/term and connects over its link port to an ESP32 running
    esp32_tilink_term. From the ESP32, USB serial leads to tools/shell.py and a shell on the
    computer, and Wi-Fi leads through SSH to a shell on another host.</desc>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="1060" height="250" rx="10" fill="#f6f8fa"/>

  <!-- the devices and the shells -->
  <g fill="#ffffff" stroke="#1f2328" stroke-width="2">
    <rect x="30" y="85" width="160" height="80" rx="8"/>
    <rect x="290" y="85" width="190" height="80" rx="8"/>
    <rect x="870" y="30" width="160" height="70" rx="8"/>
    <rect x="870" y="150" width="160" height="70" rx="8"/>
  </g>
  <!-- what carries the bytes, and what handles them -->
  <g fill="#ddf4ff" stroke="#0969da" stroke-width="1.5">
    <rect x="540" y="43" width="110" height="44" rx="6"/>
    <rect x="540" y="163" width="110" height="44" rx="6"/>
  </g>
  <g fill="#fff8c5" stroke="#9a6700" stroke-width="1.5">
    <rect x="690" y="43" width="140" height="44" rx="6"/>
    <rect x="690" y="163" width="140" height="44" rx="6"/>
  </g>

  <g fill="none" stroke="#57606a" stroke-width="2" marker-start="url(#head)" marker-end="url(#head)">
    <path d="M194,125 H286"/>
    <path d="M484,110 C512,110 508,65 536,65"/>
    <path d="M484,140 C512,140 508,185 536,185"/>
    <path d="M654,65 H686"/>
    <path d="M654,185 H686"/>
    <path d="M834,65 H866"/>
    <path d="M834,185 H866"/>
  </g>

  <g text-anchor="middle" fill="#1f2328">
    <g font-size="18" font-weight="600">
      <text x="110" y="120">Voyage 200</text>
      <text x="385" y="120">ESP32</text>
    </g>
    <g font-size="15" font-weight="600">
      <text x="950" y="61">A shell on</text>
      <text x="950" y="81">the computer</text>
      <text x="950" y="181">A shell on</text>
      <text x="950" y="201">another host</text>
      <text x="595" y="70">USB serial</text>
      <text x="595" y="190">Wi-Fi</text>
      <text x="760" y="190">SSH</text>
    </g>
    <g font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="760" y="70" font-weight="600">tools/shell.py</text>
      <g fill="#57606a">
        <text x="110" y="144">calc/term</text>
        <text x="385" y="144">esp32_tilink_term</text>
      </g>
    </g>
    <text x="240" y="113" font-size="14" fill="#57606a">link port</text>
  </g>
</svg>
