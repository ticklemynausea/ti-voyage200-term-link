# tmux for the Voyage 200 terminal (60 x 21, no colours):
#   tmux -L calc -f shell/tmux_calc.conf new -A -s calc
# -L calc gives it a server of its own, apart from your usual tmux.

# Programs inside see a terminal without colours, so they mark things with
# reverse video, which the calculator can draw.
set -g default-terminal "vt220"

# A bar on the bottom row: the windows, each named after the program running
# in it, the current one in brackets; the time on the right.
set -g status on
set -g status-position bottom
set -g status-style reverse
set -g status-left ""
set -g status-right " %H:%M "
set -g status-interval 15
setw -g window-status-format " #I #W "
setw -g window-status-current-format "[#I #W]"
setw -g automatic-rename on

# Prefix then b shows or hides the bar, to get the 21st row back.
bind b set -g status

# ESC reaches vim at once instead of after half a second.
set -sg escape-time 50
set -g mouse off

# Sized for the smallest client attached, which is the calculator. A larger
# terminal attached to the same session shows it in a corner, with dots
# around it.
set -g window-size smallest
